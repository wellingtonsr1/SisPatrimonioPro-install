# ============================================================
#  SisPatrimonio Pro - Docker Compose
#
#  Uso:
#    docker compose up -d --build     # sobe app + banco
#    docker compose logs -f app       # acompanhar
#    docker compose down              # parar (dados persistem nos volumes)
#
#  Requisitos preenchidos via variaveis de ambiente (arquivo .env na
#  mesma pasta deste compose, NAO commitado):
#    SECRET_KEY=<python -c "import secrets; print(secrets.token_hex(32))">
#    DB_PASSWORD=<senha do banco>
#    (opcionais: TZ, BACKUP_AUTO_ENABLED, BACKUP_AUTO_SCHEDULE, BACKUP_AUTO_TIME)
# ============================================================

services:
  db:
    image: mariadb:11
    container_name: sispat-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sispatrimonio_pro
      MARIADB_USER: sispatrimonio
      MARIADB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme-root}
      TZ: ${TZ:-America/Recife}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: sispat-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mariadb+pymysql://sispatrimonio:${DB_PASSWORD:?defina DB_PASSWORD no .env}@db:3306/sispatrimonio_pro
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      TZ: ${TZ:-America/Recife}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # backup/restauracao dentro do container (mysqldump ja instalado na imagem)
      # MYSQLDUMP_PATH: /usr/bin/mysqldump
      # BACKUP_AUTO_ENABLED: "true"
      # BACKUP_AUTO_SCHEDULE: daily
      # BACKUP_AUTO_TIME: "02:00"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app-data:/app/data        # backups e logs persistem fora do container

volumes:
  db-data:
  app-data:
